<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Assignment 18</title>
    <style>
        body { font-family: sans-serif; margin: 0; }
        header { background-color: #1a237e; color: white; text-align: center; padding: 20px; }
        main { padding: 20px; max-width: 800px; margin: auto; }
        table { width: 100%; border-collapse: collapse; margin-bottom: 20px; }
        table, th, td { border: 1px solid #ccc; padding: 10px; text-align: left; }
        th { background-color: #e8eaf6; }
        fieldset { border: 1px solid #999; padding: 20px; margin-bottom: 20px; }
        input[type="text"], input[type="email"], select, textarea { width: 100%; max-width: 300px; padding: 5px; margin-top: 5px; margin-bottom: 15px; }
        footer { background-color: #1a237e; color: white; text-align: center; padding: 10px; }
    </style>
</head>
<body>
    <header>
        <h1>ABC College Admission 2026</h1>
    </header>
    <main>
        <h2>Courses and Fees</h2>
        <table>
            <caption>Available Courses</caption>
            <thead>
                <tr>
                    <th>Course</th>
                    <th>Seats</th>
                    <th>Fees</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>B.Tech CSE</td>
                    <td>120</td>
                    <td>₹90,000</td>
                </tr>
                <tr>
                    <td>BCA</td>
                    <td>60</td>
                    <td>₹45,000</td>
                </tr>
            </tbody>
        </table>

        <form action="#" method="POST">
            <fieldset>
                <legend>Application Form</legend>
                
                <label for="studentName">Name:</label><br>
                <input type="text" id="studentName" name="studentName" required><br>
                
                <label for="studentEmail">Email:</label><br>
                <input type="email" id="studentEmail" name="studentEmail" required><br>
                
                <label for="courseSelect">Course:</label><br>
                <select id="courseSelect" name="courseSelect" required>
                    <option value="btech">B.Tech CSE</option>
                    <option value="bca">BCA</option>
                </select><br>
                
                <label for="statement">Statement:</label><br>
                <textarea id="statement" name="statement" rows="4" style="max-width: 500px;" required></textarea><br>
                
                <button type="submit">Apply</button>
            </fieldset>
        </form>
    </main>
    <footer>
        <p>&copy; 2026 ABC College</p>
    </footer>
<footer>
        <p>NAME-SAHIL SHARMA </p>
        <p>ADMISSION NUMBER- 2026B15310307 </p>
        <p>BRANCH - CSE AI/ML</p>
        
        

</footer>
</body>
</html>
